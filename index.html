<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2ec">
  <meta name="description" content="MAISON ALMA: peluquería, color, cortes y cuidado capilar con un enfoque personalizado. Solicita tu cita fácilmente por WhatsApp.">
  <title>MAISON ALMA — Peluquería & cuidado capilar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:#f6f2ec; --paper:#fffdf9; --ink:#282622; --muted:#777168;
      --taupe:#b5a18d; --line:#e4ddd3; --dark:#292722; --white:#fff;
      --serif:"Playfair Display", Georgia, serif; --sans:"DM Sans", Arial, sans-serif;
      --max:1180px; --shadow:0 18px 55px rgba(40,38,34,.10);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:88px}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.65}
    body.menu-open{overflow:hidden}
    a{color:inherit;text-decoration:none}
    img{display:block;width:100%;height:100%;object-fit:cover}
    button,input,select,textarea{font:inherit}
    button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
    button{cursor:pointer}
    .container{width:min(var(--max),calc(100% - 48px));margin-inline:auto}
    .eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
    h1,h2,h3,p{margin-top:0}
    h1,h2,h3{font-weight:400}
    h1,h2,.serif{font-family:var(--serif)}
    h1{font-size:clamp(3rem,7.1vw,6.5rem);line-height:1.02;letter-spacing:-.045em;margin:20px 0 24px}
    h2{font-size:clamp(2.25rem,4.5vw,4rem);line-height:1.1;letter-spacing:-.035em;margin:14px 0 22px}
    h3{font-size:1.4rem;line-height:1.25}
    .lead{font-size:1.08rem;color:#5f5a52;max-width:550px}
    .section{padding:108px 0}
    .section-head{max-width:690px;margin-bottom:44px}
    .section-head.center{text-align:center;margin-inline:auto}
    .section-head.center .lead{margin-inline:auto}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 22px;border:1px solid var(--ink);background:var(--ink);color:var(--white);font-size:.82rem;letter-spacing:.04em;transition:transform .2s,background .2s,color .2s}
    .btn:hover{transform:translateY(-2px);background:transparent;color:var(--ink)}
    .btn-light{background:transparent;color:var(--ink)}
    .btn-light:hover{background:var(--ink);color:var(--white)}
    .btn-small{padding:10px 15px;font-size:.78rem}
    .text-link{display:inline-flex;gap:9px;align-items:center;border-bottom:1px solid var(--taupe);padding-bottom:4px;font-size:.86rem}
    .text-link:hover{color:#8c7660}
    .site-header{height:82px;position:sticky;top:0;z-index:50;background:rgba(255,253,249,.93);backdrop-filter:blur(14px);border-bottom:1px solid rgba(228,221,211,.8)}
    .nav{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{font-family:var(--serif);font-size:1.55rem;letter-spacing:.17em;white-space:nowrap}
    .brand small{display:block;font:500 .52rem var(--sans);letter-spacing:.31em;text-align:center;margin-top:-4px}
    .nav-links{display:flex;align-items:center;gap:28px;font-size:.8rem;color:#4d4942}
    .nav-links a:not(.btn):hover{color:#a48b72}
    .menu-toggle{display:none;border:0;background:transparent;padding:8px;color:var(--ink)}
    .hero{background:var(--cream);padding:48px 0 56px;overflow:hidden}
    .hero-grid{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:58px;min-height:560px}
    .hero-copy{padding:35px 0}
    .hero-copy .lead{margin-bottom:30px}
    .hero-actions{display:flex;gap:13px;align-items:center;flex-wrap:wrap}
    .hero-note{display:flex;gap:12px;align-items:center;margin-top:34px;color:var(--muted);font-size:.76rem}
    .hero-note span{width:32px;height:1px;background:var(--taupe)}
    .hero-image{height:570px;position:relative}
    .hero-image img{object-position:center}
    .image-tag{position:absolute;bottom:22px;left:-24px;background:var(--paper);padding:17px 22px;box-shadow:var(--shadow);font-family:var(--serif);font-size:1.08rem}
    .image-tag small{display:block;font: .68rem var(--sans);color:var(--muted);letter-spacing:.08em;margin-top:2px}
    .trust-strip{border-bottom:1px solid var(--line);padding:24px 0}
    .trust-items{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;text-align:center}
    .trust-items div{font-size:.76rem;letter-spacing:.04em;color:#5d584f}
    .trust-items span{display:block;font-family:var(--serif);font-size:1.35rem;margin-bottom:2px;color:var(--ink)}
    .about-grid{display:grid;grid-template-columns:.92fr 1.08fr;gap:90px;align-items:center}
    .about-photo{height:600px;position:relative}
    .about-photo:after{content:"";position:absolute;inset:20px -20px -20px 20px;border:1px solid var(--taupe);z-index:0}
    .about-photo img{position:relative;z-index:1}
    .about-copy{padding:20px 0}
    .about-copy p{color:var(--muted)}
    .about-copy .text-link{margin-top:12px}
    .services{background:var(--cream)}
    .service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .service-card{background:var(--paper);padding:30px 28px 26px;border:1px solid #eee7de;display:flex;flex-direction:column;min-height:250px;transition:transform .25s,box-shadow .25s}
    .service-card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
    .service-top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:22px}
    .service-num{font-family:var(--serif);color:var(--taupe);font-size:1.45rem}
    .service-card h3{margin-bottom:10px}
    .service-card p{font-size:.88rem;color:var(--muted);margin-bottom:25px}
    .service-bottom{margin-top:auto;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:.78rem}
    .service-bottom strong{font-weight:600}
    .feature-band{background:var(--dark);color:var(--paper);padding:74px 0}
    .feature-inner{display:flex;justify-content:space-between;align-items:center;gap:50px}
    .feature-inner h2{max-width:720px;margin:12px 0 0}
    .feature-inner .eyebrow{color:#c6b7a6}
    .feature-inner .btn{border-color:#e8dfd4;background:transparent;color:var(--paper);white-space:nowrap}
    .feature-inner .btn:hover{background:var(--paper);color:var(--dark)}
    .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:245px;gap:13px}
    .gallery-item{position:relative;overflow:hidden;background:var(--cream);border:0;padding:0;text-align:left}
    .gallery-item:first-child{grid-row:span 2}
    .gallery-item img{transition:transform .5s}
    .gallery-item:hover img{transform:scale(1.055)}
    .gallery-label{position:absolute;left:12px;bottom:12px;background:rgba(255,253,249,.94);padding:7px 11px;font-size:.72rem}
    .instagram-panel{margin-top:28px;padding:25px 28px;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:22px}
    .instagram-panel p{margin:4px 0 0;color:var(--muted);font-size:.85rem}
    .instagram-feed{margin-top:24px}
    .instagram-feed iframe{width:100%;height:560px;border:0}
    .instagram-feed[hidden]{display:none}
    .process{background:var(--cream)}
    .process-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:36px}
    .process-item{border-top:1px solid var(--taupe);padding-top:22px}
    .process-item .num{font-family:var(--serif);font-size:2.2rem;color:#b6a18b}
    .process-item h3{margin:12px 0}
    .process-item p{color:var(--muted);font-size:.9rem}
    .quote-section{text-align:center;padding:100px 0}
    .quote-mark{font-family:var(--serif);font-size:4rem;color:var(--taupe);line-height:.8}
    blockquote{font:clamp(1.8rem,4vw,3.3rem)/1.25 var(--serif);max-width:850px;margin:28px auto}
    .quote-credit{font-size:.72rem;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
    .faq-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:85px}
    .faq-list{border-top:1px solid var(--line)}
    .faq-item{border-bottom:1px solid var(--line)}
    .faq-question{width:100%;background:transparent;border:0;padding:22px 0;display:flex;justify-content:space-between;gap:20px;text-align:left;color:var(--ink);font-size:.96rem}
    .faq-question span:last-child{font-size:1.3rem;transition:transform .2s}
    .faq-question[aria-expanded="true"] span:last-child{transform:rotate(45deg)}
    .faq-answer{padding:0 25px 20px 0;color:var(--muted);font-size:.88rem}
    .faq-answer[hidden]{display:none}
    .contact{background:var(--cream)}
    .contact-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:75px;align-items:start}
    .contact-info{padding-top:15px}
    .contact-info p{color:var(--muted)}
    .contact-detail{margin-top:30px}
    .contact-detail strong{display:block;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
    .contact-detail span,.contact-detail a{font-size:.9rem;color:#5d584f}
    .contact-form{background:var(--paper);padding:35px;border:1px solid #ece4da}
    .form-intro{font-size:.86rem;color:var(--muted);margin-bottom:25px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field.full{grid-column:1/-1}
    .field label{font-size:.78rem;font-weight:600}
    .field input,.field select,.field textarea{width:100%;border:1px solid #ded6cc;background:#fffdf9;padding:12px 13px;border-radius:0;color:var(--ink);outline:none;min-width:0}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:#8e7964;box-shadow:0 0 0 2px rgba(142,121,100,.12)}
    .field textarea{min-height:105px;resize:vertical}
    .field input::placeholder,.field textarea::placeholder{color:#a29a90}
    .privacy{display:flex;align-items:flex-start;gap:10px;font-size:.74rem;color:var(--muted);margin:20px 0}
    .privacy input{margin-top:5px;accent-color:var(--ink)}
    .privacy a{text-decoration:underline}
    .form-note{font-size:.74rem;color:var(--muted);margin:13px 0 0}
    .form-message{font-size:.84rem;padding:12px 14px;margin:0 0 16px;border:1px solid #c8b7a4;background:#f8f1e8}
    .form-message[hidden]{display:none}
    .map-wrap{margin-top:60px}
    .map-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:17px}
    .map-head h3{margin:0;font-family:var(--serif);font-size:1.8rem}
    .map-frame{width:100%;height:350px;border:0;background:#e8e1d7}
    .map-placeholder{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;border:1px dashed #cbbdad;color:var(--muted)}
    .map-placeholder p{max-width:480px;margin:8px auto 0;font-size:.88rem}
    .site-footer{background:var(--dark);color:var(--paper);padding:60px 0 25px}
    .footer-main{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:55px;padding-bottom:45px}
    .footer-brand{font-family:var(--serif);font-size:1.8rem;letter-spacing:.15em}
    .footer-brand small{display:block;font:500 .58rem var(--sans);letter-spacing:.28em;margin-top:0}
    .footer-copy{color:#c2bbb0;font-size:.84rem;max-width:320px;margin-top:18px}
    .footer-col strong{display:block;font-size:.73rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:17px;color:#d6c9b9}
    .footer-col a,.footer-col p{display:block;font-size:.83rem;color:#d2cbc1;margin:8px 0}
    .footer-col a:hover{color:white}
    .footer-bottom{border-top:1px solid #49463f;padding-top:20px;display:flex;justify-content:space-between;gap:20px;font-size:.72rem;color:#aaa398}
    .footer-bottom a{text-decoration:underline}
    .whatsapp-float{position:fixed;right:22px;bottom:22px;z-index:40;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#277b55;color:#fff;box-shadow:0 8px 24px #0002;transition:transform .2s}
    .whatsapp-float:hover{transform:translateY(-3px)}
    .whatsapp-float svg{width:25px;height:25px;fill:currentColor}
    .to-top{position:fixed;right:28px;bottom:88px;z-index:39;border:1px solid var(--line);background:var(--paper);width:38px;height:38px;display:none;align-items:center;justify-content:center}
    .to-top.visible{display:flex}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:100;background:var(--dark);color:white;padding:13px 18px;font-size:.83rem;box-shadow:var(--shadow);transition:all .25s;max-width:calc(100% - 32px)}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .lightbox{position:fixed;inset:0;z-index:110;background:rgba(22,21,19,.92);display:none;align-items:center;justify-content:center;padding:30px}
    .lightbox.open{display:flex}
    .lightbox img{max-width:min(900px,90vw);max-height:82vh;width:auto;height:auto;object-fit:contain}
    .lightbox-close{position:absolute;right:25px;top:20px;background:transparent;color:white;border:0;font-size:2rem}
    .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}
    .reveal.in-view{opacity:1;transform:none}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important;animation:none!important}.reveal{opacity:1;transform:none}}
    @media(max-width:900px){
      .container{width:min(var(--max),calc(100% - 36px))}
      .nav-links{gap:16px}
      .nav-links a:not(.btn){font-size:.75rem}
      .hero-grid{gap:30px;min-height:0}.hero-image{height:490px}
      .about-grid{gap:50px}.about-photo{height:500px}
      .gallery-grid{grid-auto-rows:200px}
      .contact-grid{gap:35px}.faq-grid{gap:45px}
    }
    @media(max-width:700px){
      .site-header{height:72px}.brand{font-size:1.35rem}
      .menu-toggle{display:block;z-index:61}
      .menu-toggle svg{width:25px;height:25px}
      .nav-links{display:none;position:fixed;inset:72px 0 0;background:var(--paper);z-index:60;flex-direction:column;align-items:stretch;padding:30px 26px;gap:0}
      .nav-links.open{display:flex}
      .nav-links a:not(.btn){font-size:1rem;padding:16px 0;border-bottom:1px solid var(--line)}
      .nav-links .btn{margin-top:24px}
      .section{padding:76px 0}
      .hero{padding:22px 0 35px}
      .hero-grid{grid-template-columns:1fr;gap:25px}
      .hero-copy{padding:25px 0 0}
      h1{font-size:clamp(3.2rem,14vw,5rem)}
      .hero-image{height:390px;margin-left:12px}
      .image-tag{left:-12px}
      .trust-items{grid-template-columns:repeat(2,1fr);row-gap:22px}
      .about-grid{grid-template-columns:1fr;gap:45px}
      .about-photo{height:410px;margin-right:12px}
      .service-grid{grid-template-columns:1fr}
      .service-card{min-height:0}
      .feature-inner{align-items:flex-start;flex-direction:column;gap:25px}
      .gallery-grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:180px;gap:9px}
      .gallery-item:first-child{grid-row:span 2}
      .instagram-panel{align-items:flex-start;flex-direction:column;padding:22px}
      .process-grid{grid-template-columns:1fr;gap:26px}
      .quote-section{padding:75px 0}
      .faq-grid{grid-template-columns:1fr;gap:20px}
      .contact-grid{grid-template-columns:1fr;gap:30px}
      .contact-form{padding:23px 18px}
      .form-grid{grid-template-columns:1fr}
      .field.full{grid-column:auto}
      .map-wrap{margin-top:45px}
      .map-head{align-items:flex-start;flex-direction:column}
      .map-frame{height:280px}
      .footer-main{grid-template-columns:1fr 1fr;gap:35px 22px}
      .footer-main>div:first-child{grid-column:1/-1}
      .footer-bottom{flex-direction:column;gap:8px}
      .whatsapp-float{right:15px;bottom:15px}
      .to-top{right:23px;bottom:78px}
    }
  </style>
</head>
